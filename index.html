<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05071a" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <title>World Guard</title>
  </head>
  <body>
    <!-- Pictogramele modulelor (din docs/machete-nava-cu-module.html), folosite prin <use href="#i-…">. -->
    <svg class="icons" width="0" height="0" aria-hidden="true" focusable="false">
      <symbol id="i-wave" viewBox="0 0 24 24"><g class="ico"><path d="M4 14a6 6 0 0 1 6 6"/><path d="M4 9a11 11 0 0 1 11 11"/><path d="M4 4a16 16 0 0 1 16 16"/></g></symbol>
      <symbol id="i-laser" viewBox="0 0 24 24"><g class="ico"><path d="M3 21 15 9"/><circle cx="17" cy="7" r="2.5"/><path d="M17 1.5v2M22.5 7h-2M21 3l-1.4 1.4"/></g></symbol>
      <symbol id="i-missile" viewBox="0 0 24 24"><g class="ico" transform="rotate(45 12 12)"><path d="M12 2.5c2.2 1.9 3.2 4.7 3.2 8.2V16H8.8v-5.3c0-3.5 1-6.3 3.2-8.2z"/><path d="M8.8 12.3 6.2 15.6V18l2.6-2M15.2 12.3l2.6 3.3V18l-2.6-2M12 18.8v2.7"/></g></symbol>
      <symbol id="i-armor" viewBox="0 0 24 24"><g class="ico"><path d="M12 3 5 6v5.5c0 4.3 2.9 7.6 7 9.5 4.1-1.9 7-5.2 7-9.5V6z"/></g></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><g class="ico"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.5"/></g></symbol>
      <symbol id="i-mender" viewBox="0 0 24 24"><g class="ico"><path d="M12 5v14M5 12h14"/></g></symbol>
      <symbol id="i-engine" viewBox="0 0 24 24"><g class="ico"><path d="M5 6l6 6-6 6M13 6l6 6-6 6"/></g></symbol>
      <symbol id="i-magnet" viewBox="0 0 24 24"><g class="ico"><path d="M6 4v8a6 6 0 0 0 12 0V4h-4v8a2 2 0 0 1-4 0V4z"/></g></symbol>
      <symbol id="i-relay" viewBox="0 0 24 24"><g class="ico"><path d="M12 21V11M8 21h8"/><circle cx="12" cy="8.5" r="2"/><path d="M7 13a7 7 0 0 1 0-9M17 13a7 7 0 0 0 0-9"/></g></symbol>
      <symbol id="i-gun" viewBox="0 0 24 24"><g class="ico"><path d="M7 19v-8M12 19V4M17 19v-8"/><path d="M5 21h14"/></g></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><g class="ico"><rect x="6" y="11" width="12" height="9" rx="2"/><path d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/></g></symbol>
    </svg>
    <div class="stage" id="stage">
      <canvas id="field" data-str-aria="fieldLabel"></canvas>

      <div class="hud" id="hud">
        <div class="banner" id="banner">
          <div class="stock"><i class="chip chip-crystal"></i><b id="crystal"></b><span data-str="crystal"></span></div>
          <div class="stock"><i class="chip chip-metal"></i><b id="metal"></b><span data-str="metal"></span></div>
          <div class="time"><span class="fps" id="fps"></span><div class="clock" id="clock"></div></div>
          <button class="pause off" id="pause" type="button" data-str-aria="pause" tabindex="-1"></button>
          <div class="core">
            <span data-str="core"></span>
            <div class="meter" id="meter"><i id="coreFill"></i></div>
            <b id="coreHp"></b>
          </div>
          <div class="ship" id="ship">
            <div class="level">
              <svg class="ring" viewBox="0 0 36 36" aria-hidden="true"><circle class="ring-track" cx="18" cy="18" r="15"/><circle class="ring-fill" id="xpRing" cx="18" cy="18" r="15" pathLength="100"/></svg>
              <b id="level"></b>
            </div>
            <div class="slots" id="shipSlots"></div>
            <span class="xp" id="xpText"></span>
          </div>
        </div>
        <!-- Banda din zbor: ia locul celei de sus cât se zboară; rândul „ai cules” stă sub ea, fără să-i schimbe înălțimea.
             Cristalele și metalul, doar cu semnul și cifra: la 360 px lățime încap și cele 7 vieți ale Carenei la plafon. -->
        <div class="banner fl" id="flightBanner" hidden>
          <div class="fl-row">
            <div class="stock"><i class="chip chip-crystal"></i><b id="flCrystal"></b></div>
            <div class="stock"><i class="chip chip-metal"></i><b id="flMetal"></b></div>
            <span class="fl-hits" id="flHits"></span>
          </div>
          <div class="fl-row fl-way" id="flWay"><span id="flLabel"></span><span class="fl-track"><i id="flFill"></i></span><span id="flPct"></span></div>
          <div class="fl-row fl-ship">
            <div class="fl-mods" id="flMods"></div>
            <button class="pause off" id="flightPause" type="button" data-str-aria="pause" tabindex="-1"></button>
          </div>
        </div>
        <p class="fl-toast" id="flToast" hidden></p>
      </div>

      <p class="hint" id="hint" hidden><span data-str="hint"></span></p>

      <div class="veil" id="startVeil" hidden>
        <div class="card">
          <h1 data-str="title"></h1>
          <div class="reserve">
            <span class="res"><i class="chip chip-crystal"></i><b id="startCrystal"></b><span data-str="crystal"></span></span>
            <span class="res"><i class="chip chip-metal"></i><b id="startMetal"></b><span data-str="metal"></span></span>
            <button class="pill" id="startWorkshop" type="button" data-str="workshop"></button>
          </div>
          <button class="mode main" id="start" type="button"><strong data-str="defend"></strong><span id="defendLine"></span></button>
          <div class="mode second">
            <button class="mode-go" id="explore" type="button"><strong data-str="explore"></strong><span data-str="exploreLine"></span></button>
            <div class="sector">
              <button class="step less" id="sectorDown" type="button" data-str-aria="sectorLess"></button>
              <b id="sectorN"></b>
              <button class="step more" id="sectorUp" type="button" data-str-aria="sectorMore"></button>
            </div>
          </div>
          <button class="go line" id="continue" type="button" hidden></button>
          <button class="go quiet" id="stress" type="button" data-str="stress"></button>
        </div>
      </div>

      <div class="veil" id="flightPauseVeil" hidden>
        <div class="card">
          <h1 data-str="flightPauseTitle"></h1>
          <div class="haul-block">
            <span class="eyebrow" data-str="flightSoFar"></span>
            <div class="haul">
              <div class="cr"><span data-str="crystal"></span><b id="pauseCrystal"></b></div>
              <div class="me"><span data-str="metal"></span><b id="pauseMetal"></b></div>
            </div>
          </div>
          <button class="go" id="flightResume" type="button" data-str="resume"></button>
          <button class="go alt" id="quitFlight" type="button" data-str="quitFlight"></button>
        </div>
      </div>

      <div class="veil" id="flightOverVeil" hidden>
        <div class="card">
          <div class="card-head">
            <span class="eyebrow" id="flightOverSector"></span>
            <h1 id="flightOverTitle"></h1>
          </div>
          <div class="haul-block">
            <span class="eyebrow" id="flightOverLabel"></span>
            <div class="haul">
              <div class="cr"><span data-str="crystal"></span><b id="overCrystal"></b></div>
              <div class="me"><span data-str="metal"></span><b id="overMetal"></b></div>
            </div>
          </div>
          <div class="reserve">
            <span class="res" data-str="reserve"></span>
            <span class="res"><i class="chip chip-crystal"></i><b id="flightOverCrystal"></b></span>
            <span class="res"><i class="chip chip-metal"></i><b id="flightOverMetal"></b></span>
            <button class="pill" id="overWorkshop" type="button" data-str="workshop"></button>
          </div>
          <button class="go" id="flightNext" type="button"></button>
          <button class="go line" id="flightHome" type="button" data-str="backHome"></button>
        </div>
      </div>

      <div class="veil" id="pauseVeil" hidden>
        <div class="card">
          <h1 data-str="pauseTitle"></h1>
          <div class="result"><span data-str="pauseSoFar"></span><b id="pauseTime"></b></div>
          <button class="go" id="resume" type="button" data-str="resume"></button>
          <button class="go alt" id="fresh" type="button" data-str="fresh"></button>
          <button class="go line" id="pauseHome" type="button" data-str="backHome"></button>
        </div>
      </div>

      <div class="veil shop" id="shopVeil" hidden>
        <div class="card shop-card" id="shopCard" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="shopTitle">
          <div class="card-head">
            <span class="eyebrow" data-str="shopEyebrow"></span>
            <h1 id="shopTitle" data-str="workshop"></h1>
          </div>
          <div class="reserve">
            <span class="res"><i class="chip chip-crystal"></i><b id="shopCrystal"></b><span data-str="crystal"></span></span>
            <span class="res"><i class="chip chip-metal"></i><b id="shopMetal"></b><span data-str="metal"></span></span>
          </div>
          <div class="ups" id="shopRows"></div>
          <button class="go line" id="shopBack" type="button" data-str="back"></button>
        </div>
      </div>

      <div class="veil choice" id="choiceVeil" hidden>
        <div class="card pick" id="choiceCard" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="choiceTitle">
          <div class="pick-head">
            <div class="pick-title">
              <span class="pick-level" id="choiceLevel"></span>
              <h1 id="choiceTitle" data-str="chooseTitle"></h1>
            </div>
            <div class="slots" id="choiceSlots"></div>
          </div>
          <div class="offers" id="choiceOffers"></div>
          <p class="pick-note" data-str="chooseNote"></p>
        </div>
      </div>

      <div class="veil" id="overVeil" hidden>
        <div class="card">
          <h1 data-str="overTitle"></h1>
          <div class="result"><span data-str="overSurvived"></span><b id="overTime"></b></div>
          <dl class="facts">
            <div><dt id="recordLabel" data-str="record"></dt><dd id="overRecord"></dd></div>
            <div><dt data-str="overKills"></dt><dd id="overKills"></dd></div>
          </dl>
          <button class="go" id="again" type="button" data-str="again"></button>
          <button class="go line" id="overHome" type="button" data-str="backHome"></button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
